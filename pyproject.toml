[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factorylens"
version = "0.1.0"
description = "Open-source observability and black-box recording for legacy industrial machines."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "aaariel18" }]
keywords = ["industrial", "cnc", "observability", "computer-vision", "rtsp", "manufacturing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
camera = ["opencv-python>=4.10"]

[project.scripts]
factorylens = "factorylens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
